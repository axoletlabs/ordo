name: Parallel APK executor benchmark

on:
  push:
    branches: [ci/parallel-executor-benchmark]

permissions:
  contents: read

jobs:
  benchmark-key:
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
    runs-on: ubuntu-24.04
    env:
      EXPO_UPDATES_CHANNEL: stable
      ORDO_APP_VARIANT: stable
      ORDO_BUILD_BRANCH: release/0.3.1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Resolve release version and version code
        id: version
        run: |
          VERSION=$(node -e "console.log(require('./apps/mobile/app.config.js').version)")
          VERSION_CODE=$(VERSION="$VERSION" node -e "const {execFileSync}=require('node:child_process'); const {androidBuildNumber}=require('./scripts/release-policy.js'); const tags=execFileSync('git',['tag','--list'],{encoding:'utf8'}).trim().split(/\\s+/); const n=androidBuildNumber(process.env.VERSION,tags); if(n == null || n < 1) process.exit(1); process.stdout.write(String(n))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
      - name: Create an ephemeral benchmark key
        run: >-
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/ordo-bench.p12"
          -storetype PKCS12 -storepass ordo-bench-pass -keypass ordo-bench-pass
          -alias ordo -dname "CN=Ordo CI benchmark" -keyalg RSA -keysize 2048
          -validity 2
      - uses: actions/upload-artifact@v6
        with:
          name: benchmark-signing-key
          path: ${{ runner.temp }}/ordo-bench.p12
          retention-days: 1

  build_abi:
    needs: benchmark-key
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
    env:
      EXPO_UPDATES_CHANNEL: stable
      ORDO_APP_VARIANT: stable
      ORDO_BUILD_BRANCH: release/0.3.1
      APP_VERSION: ${{ needs.benchmark-key.outputs.version }}
      ANDROID_VERSION_CODE: ${{ needs.benchmark-key.outputs.version_code }}
      ORDO_ENABLE_CCACHE: '1'
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      ORDO_UPLOAD_STORE_TYPE: PKCS12
      ORDO_UPLOAD_STORE_PASSWORD: ordo-bench-pass
      ORDO_UPLOAD_KEY_ALIAS: ordo
      ORDO_UPLOAD_KEY_PASSWORD: ordo-bench-pass
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: /home/runner/.ccache
          key: ccache-Linux-benchmark-${{ github.run_id }}-${{ matrix.abi }}
          restore-keys: ccache-Linux-
      - name: Prepare ccache
        run: |
          command -v ccache >/dev/null || sudo apt-get install -y ccache
          ccache --set-config=max_size=3G
          ccache --zero-stats >/dev/null
      - name: Download shared benchmark key
        uses: actions/download-artifact@v6
        with:
          name: benchmark-signing-key
          path: ${{ runner.temp }}
      - name: Configure benchmark signing
        run: echo "ORDO_UPLOAD_STORE_FILE=$RUNNER_TEMP/ordo-bench.p12" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @ordo/shared build
      - name: Prebuild Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Verify embedded channel and fingerprint
        working-directory: apps/mobile
        run: |
          grep -q 'expo-channel-name' android/app/src/main/AndroidManifest.xml
          grep -q 'stable' android/app/src/main/AndroidManifest.xml
          node "$GITHUB_WORKSPACE/.github/scripts/generate-android-fingerprint.js" --platform android \
            > "$RUNNER_TEMP/android-fingerprint.json"
          HASH="$(jq -r '.hash' "$RUNNER_TEMP/android-fingerprint.json")"
          echo "$HASH" > "$RUNNER_TEMP/android-runtime-version.txt"
          echo "EXPO_UPDATES_FINGERPRINT_OVERRIDE=$HASH" >> "$GITHUB_ENV"
      - name: Build one ABI
        working-directory: apps/mobile/android
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -o pipefail
          START=$(date +%s)
          ./gradlew assembleRelease \
            -PreactNativeArchitectures="$ABI" \
            -Pandroid.versionCode="$ANDROID_VERSION_CODE" \
            --max-workers=4 2>&1 | tee "$RUNNER_TEMP/gradle-$ABI.log"
          ELAPSED=$(($(date +%s) - START))
          echo "Gradle ABI $ABI elapsed: ${ELAPSED}s"
          echo "ABI_BUILD_SECONDS=$ELAPSED" >> "$GITHUB_ENV"
      - name: Show ccache stats
        if: always()
        run: ccache --show-stats
      - name: Prepare ABI artifact
        env:
          ABI: ${{ matrix.abi }}
        run: |
          mkdir -p "$RUNNER_TEMP/abi-artifact"
          cp "apps/mobile/android/app/build/outputs/apk/release/app-release.apk" \
            "$RUNNER_TEMP/abi-artifact/app-$ABI-release.apk"
          cp "$RUNNER_TEMP/android-runtime-version.txt" "$RUNNER_TEMP/abi-artifact/runtime.txt"
      - uses: actions/upload-artifact@v6
        with:
          name: apk-${{ matrix.abi }}
          path: ${{ runner.temp }}/abi-artifact
          retention-days: 1

  merge_and_verify:
    needs: [benchmark-key, build_abi]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APP_VERSION: ${{ needs.benchmark-key.outputs.version }}
      ANDROID_VERSION_CODE: ${{ needs.benchmark-key.outputs.version_code }}
      ORDO_UPLOAD_STORE_TYPE: PKCS12
      ORDO_UPLOAD_STORE_PASSWORD: ordo-bench-pass
      ORDO_UPLOAD_KEY_ALIAS: ordo
      ORDO_UPLOAD_KEY_PASSWORD: ordo-bench-pass
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v6
        with:
          pattern: apk-*
          path: ${{ runner.temp }}/abi-artifacts
          merge-multiple: false
      - uses: actions/download-artifact@v6
        with:
          name: benchmark-signing-key
          path: ${{ runner.temp }}
      - name: Configure benchmark signing
        run: echo "ORDO_UPLOAD_STORE_FILE=$RUNNER_TEMP/ordo-bench.p12" >> "$GITHUB_ENV"
      - name: Assemble universal APK from ABI outputs
        env:
          RELEASE_DIR: ${{ runner.temp }}/release
        run: |
          mkdir -p "$RELEASE_DIR"
          for ABI in armeabi-v7a arm64-v8a x86 x86_64; do
            cp "$RUNNER_TEMP/abi-artifacts/apk-$ABI/app-$ABI-release.apk" \
              "$RELEASE_DIR/app-$ABI-release.apk"
          done
          RUNTIME=$(cat "$RUNNER_TEMP/abi-artifacts/apk-arm64-v8a/runtime.txt")
          python3 .github/scripts/merge-abi-apks.py \
            --arm64 "$RUNNER_TEMP/abi-artifacts/apk-arm64-v8a/app-arm64-v8a-release.apk" \
            --armeabi-v7a "$RUNNER_TEMP/abi-artifacts/apk-armeabi-v7a/app-armeabi-v7a-release.apk" \
            --x86 "$RUNNER_TEMP/abi-artifacts/apk-x86/app-x86-release.apk" \
            --x86_64 "$RUNNER_TEMP/abi-artifacts/apk-x86_64/app-x86_64-release.apk" \
            --output "$RUNNER_TEMP/universal-unsigned.apk"
          BUILD_TOOLS=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -f -p 4 "$RUNNER_TEMP/universal-unsigned.apk" \
            "$RUNNER_TEMP/universal-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/ordo-bench.p12" --ks-type PKCS12 \
            --ks-key-alias ordo --ks-pass pass:ordo-bench-pass \
            --key-pass pass:ordo-bench-pass \
            --out "$RELEASE_DIR/app-universal-release.apk" \
            "$RUNNER_TEMP/universal-aligned.apk"
          ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}" \
            python3 .github/scripts/verify-apks.py "$RELEASE_DIR" \
              --version "$APP_VERSION" --base-code "$ANDROID_VERSION_CODE" \
              --runtime "$RUNTIME" --channel stable --release
      - uses: actions/upload-artifact@v6
        with:
          name: parallel-release-candidate
          path: ${{ runner.temp }}/release
          retention-days: 1
