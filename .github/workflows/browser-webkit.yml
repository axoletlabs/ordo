name: Browser WebKit

on:
  pull_request:
    paths:
      - 'apps/mobile/src/lib/browser-ad-blocking.ts'
      - 'apps/mobile/tests/**'
      - 'patches/react-native-webview*'
      - '.github/workflows/browser-webkit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-webkit:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm-node
      - run: pnpm install --frozen-lockfile
      - name: Generate the app's content rules
        working-directory: apps/mobile
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { loadTypeScript } from './tests/load-typescript.mjs';
          const { browserAdBlockingRules } = loadTypeScript('../src/lib/browser-ad-blocking.ts');
          writeFileSync('/tmp/ordo-webkit-rules.json', browserAdBlockingRules(true, ['www.publisher.ordo.test']));
          JS
      - name: Run WebKit resource and compatibility tests
        working-directory: apps/mobile
        run: |
          echo '127.0.0.1 publisher.ordo.test www.publisher.ordo.test ads.doubleclick.net' | sudo tee -a /etc/hosts
          node tests/webkit-fixture.mjs > /tmp/ordo-webkit-fixture.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid"' EXIT
          swift tests/webkit-ad-blocking.swift /tmp/ordo-webkit-rules.json 8739
      - name: Build shared types
        run: pnpm --filter @ordo/shared build
      - name: Generate iOS project and pods
        working-directory: apps/mobile
        run: |
          pnpm exec expo prebuild --platform ios --no-install
          cd ios
          pod install
      - name: Compile patched WebView in the iOS app
        working-directory: apps/mobile
        run: |
          workspace=$(node -e "process.stdout.write(require('node:fs').readdirSync('ios').find(f=>f.endsWith('.xcworkspace')))")
          scheme="${workspace%.xcworkspace}"
          if ! xcodebuild -workspace "ios/$workspace" -scheme "$scheme" -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build > /tmp/ordo-ios-build.log 2>&1; then
            tail -200 /tmp/ordo-ios-build.log
            exit 1
          fi
