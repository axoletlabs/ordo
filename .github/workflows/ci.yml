name: CI

on:
  push:
    branches: ['**']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build an arm64 dev APK'
        required: false
        default: 'false'
        type: boolean
      publish_ota:
        description: 'Publish an EAS Update (main or preview branch only)'
        required: false
        default: 'false'
        type: boolean
      republish_ota_group:
        description: 'Republish an existing EAS update group (new createdAt, same bundle)'
        required: false
        default: ''
        type: string

# Native GitHub Releases:
#   Latest (stable): tag vX.Y.Z, "Set as the latest release", pre-release unchecked.
#   Early: tag vX.Y.Z-alpha.N | -beta.N | -rc.N, "This is a pre-release" checked.
# EAS Update channels (baked into the APK, not switched in-app):
#   production  — GitHub Latest / `main` while apps/mobile version is stable X.Y.Z
#   development — GitHub pre-release / `main` while version is alpha|beta|rc
#   preview     — `preview` git branch dogfood APKs only (not feature branches)
# JS-only updates on main or preview go to that stream's channel when the
# Android fingerprint matches the last (or in-flight) APK on the same branch.
# Detect ignores packageJson:scripts and extra.ordo so a test-file list edit
# does not mint a new APK. eas update --auto still hashes those sources, so
# the OTA job also publishes the same JS to older APK runtimes whose native
# fingerprint matches (last 5 successful build_apk SHAs).
# The OTA job waits for that APK to finish packaging so createdAt is newer
# than the binary's embedded commitTime; expo-updates ignores older OTAs.
# Concurrency is per-job, not workflow-wide. A workflow-level group would
# cancel an in-flight APK when a later JS-only push starts OTA, leaving that
# native fingerprint with no binary.
jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.info.outputs.version }}
      version_code: ${{ steps.info.outputs.version_code }}
      should_build: ${{ steps.route.outputs.should_build }}
      is_release: ${{ steps.info.outputs.is_release }}
      build_ref: ${{ steps.info.outputs.build_ref }}
      updates_channel: ${{ steps.info.outputs.updates_channel }}
      extra_runtime_versions: ${{ steps.eligibility.outputs.extra_runtime_versions }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gather trigger info
        id: info
        run: |
          VERSION=$(node -e "console.log(require('./apps/mobile/app.config.js').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          BRANCH="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "release" ]; then
            # Tag names must not select the preview stream.
            BRANCH=""
          fi
          CHANNEL=$(node "$GITHUB_WORKSPACE/.github/scripts/validate-release-tag.js" --channel "$VERSION" --branch "$BRANCH")
          echo "updates_channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "EAS Update channel: $CHANNEL (branch=${BRANCH:-none})"
          # Base versionCode is the workflow run number. Gradle multiplies by
          # 10 and adds a per-ABI offset (0-4) so split APKs stay ordered.
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "build_ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "release" ]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm for OTA eligibility check
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview')
        uses: pnpm/action-setup@v5

      - name: Setup Node.js for OTA eligibility check
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview')
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Check Android native fingerprint
        id: eligibility
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview')
        continue-on-error: true
        # Last-resort cap if createFingerprintAsync never resolves. Extra
        # APK worktrees need time for pnpm install; keep this above that.
        timeout-minutes: 15
        env:
          CURRENT_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Don't wait on a leftover .git/index.lock from a fingerprint child
          # that is still running git status via app.config.js.
          GIT_OPTIONAL_LOCKS: '0'
        run: |
          if [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            echo "native_changed=true" >> "$GITHUB_OUTPUT"
            echo "extra_runtime_versions=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Compare against an in-flight CI run on this stream (main or
          # preview) when one exists (an APK still building, or detect still
          # running), else the last shipped APK on the same branch. Never
          # compare preview to a production APK — the baked channel differs.
          # Parent-commit comparison is wrong: a cancelled native bump would
          # make later JS look unchanged vs parent and OTA a runtime that
          # never got a binary. An in-flight APK *will* produce that binary,
          # so a JS-only follow-up should OTA onto it instead of starting a
          # second APK.
          BASELINE_SHA="$(bash "$GITHUB_WORKSPACE/.github/scripts/apk-baseline-sha.sh" "$GITHUB_REF_NAME" || true)"
          if [[ -z "$BASELINE_SHA" ]]; then
            echo "No APK baseline on ${GITHUB_REF_NAME}; treating as native-incompatible"
            echo "native_changed=true" >> "$GITHUB_OUTPUT"
            echo "extra_runtime_versions=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Fingerprint baseline SHA: $BASELINE_SHA"
          if [[ "$BASELINE_SHA" == "$CURRENT_SHA" ]]; then
            echo "This commit is the fingerprint baseline"
            echo "native_changed=false" >> "$GITHUB_OUTPUT"
            echo "extra_runtime_versions=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Isolated worktree + a wrapper that process.exit()s after JSON so
          # leftover autolinking children cannot wedge detect.
          SCRIPT="$GITHUB_WORKSPACE/.github/scripts/generate-android-fingerprint.js"
          PREV_DIR="${RUNNER_TEMP}/fp-prev"
          rm -rf "$PREV_DIR"
          git worktree add --detach "$PREV_DIR" "$BASELINE_SHA"
          cleanup() { git worktree remove --force "$PREV_DIR" 2>/dev/null || true; }
          trap cleanup EXIT

          generate_fingerprint() {
            local dir="$1"
            local out="$2"
            echo "Installing $(git -C "$dir" rev-parse --short HEAD) in $dir"
            (cd "$dir" && pnpm install --frozen-lockfile --config.dangerouslyAllowAllBuilds=true)
            echo "Generating fingerprint for $(git -C "$dir" rev-parse --short HEAD)"
            # stdin closed: ExpoConfigLoader / autolinking inherit the Actions
            # pipe and can wait forever for EOF. timeout is a last resort if
            # createFingerprintAsync itself never resolves.
            (
              cd "$dir/apps/mobile"
              timeout --kill-after=5s 60s node "$SCRIPT" --platform android \
                < /dev/null > "$out"
            )
            echo "Wrote $out ($(wc -c < "$out") bytes)"
          }

          generate_fingerprint "$PREV_DIR" /tmp/fingerprint-previous.json
          generate_fingerprint "$GITHUB_WORKSPACE" /tmp/fingerprint-current.json

          NORMALIZE="$GITHUB_WORKSPACE/.github/scripts/normalize-android-fingerprint.jq"
          normalize_fingerprint() {
            jq -f "$NORMALIZE" "$1" > "$1.normalized"
          }

          # extra.ordo and packageJson:scripts change every JS commit / test file
          # but do not affect native compatibility. Stripping them for routing
          # avoids minting a new APK (and abandoning the previous runtime).
          normalize_fingerprint /tmp/fingerprint-previous.json
          normalize_fingerprint /tmp/fingerprint-current.json

          extra_runtimes=()
          current_hash="$(jq -r '.hash' /tmp/fingerprint-current.json)"
          collect_runtime_if_compatible() {
            local sha="$1"
            local fp="$2"
            local hash
            hash="$(jq -r '.hash' "$fp")"
            if [[ -z "$hash" || "$hash" == "null" || "$hash" == "$current_hash" ]]; then
              return 0
            fi
            normalize_fingerprint "$fp"
            if cmp -s /tmp/fingerprint-current.json.normalized "$fp.normalized"; then
              case " ${extra_runtimes[*]} " in
                *" $hash "*) return 0 ;;
              esac
              echo "Compatible APK runtime ${hash} from ${sha}"
              extra_runtimes+=("$hash")
            else
              echo "Skipping APK ${sha}: native fingerprint differs"
            fi
          }

          if cmp -s /tmp/fingerprint-previous.json.normalized /tmp/fingerprint-current.json.normalized; then
            echo "native_changed=false" >> "$GITHUB_OUTPUT"
            collect_runtime_if_compatible "$BASELINE_SHA" /tmp/fingerprint-previous.json
            while read -r apk_sha; do
              [[ -z "$apk_sha" ]] && continue
              if [[ "$apk_sha" == "$CURRENT_SHA" || "$apk_sha" == "$BASELINE_SHA" ]]; then
                continue
              fi
              extra_dir="${RUNNER_TEMP}/fp-${apk_sha:0:8}"
              rm -rf "$extra_dir"
              git worktree add --detach "$extra_dir" "$apk_sha"
              if generate_fingerprint "$extra_dir" "/tmp/fingerprint-${apk_sha}.json"; then
                collect_runtime_if_compatible "$apk_sha" "/tmp/fingerprint-${apk_sha}.json"
              else
                echo "Skipping APK ${apk_sha}: fingerprint failed"
              fi
              git worktree remove --force "$extra_dir" 2>/dev/null || true
            done < <(bash "$GITHUB_WORKSPACE/.github/scripts/last-apk-shas.sh" "$GITHUB_REF_NAME" 5 || true)
          else
            echo "native_changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "extra_runtime_versions=${extra_runtimes[*]}" >> "$GITHUB_OUTPUT"

      - name: Select OTA or APK build
        id: route
        env:
          BUILD_INPUT: ${{ inputs.build_apk }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.release.body || '' }}
          # Treat an inconclusive fingerprint check as native-incompatible.
          NATIVE_CHANGED: ${{ steps.eligibility.outputs.native_changed || 'true' }}
        run: |
          MSG=$(echo "$COMMIT_MSG" | head -1)
          if [[ "${{ github.event_name }}" = "release" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" = "workflow_dispatch" && "$BUILD_INPUT" = "true" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [[ "$MSG" == *-apk ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" = "push" && ( "${{ github.ref }}" = "refs/heads/main" || "${{ github.ref }}" = "refs/heads/preview" ) && "$NATIVE_CHANGED" = "true" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard OTA publish
        if: github.event_name == 'workflow_dispatch' && inputs.publish_ota == true && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/preview'
        run: |
          echo "::error::OTA publish is only allowed from main or preview (not ${GITHUB_REF_NAME})."
          exit 1

      - name: Validate release tag
        if: github.event_name == 'release'
        run: |
          node "$GITHUB_WORKSPACE/.github/scripts/validate-release-tag.js" \
            "${{ github.event.release.tag_name }}" \
            "${{ steps.info.outputs.version }}" \
            "${{ github.event.release.prerelease }}"

  analyze:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: ci-analyze-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.dangerouslyAllowAllBuilds=true

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build shared package
        run: pnpm --filter @ordo/shared build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test

  ota:
    needs: detect
    # Publishes a JS-only update to this stream's channel:
    #   main    → production (stable version) or development (alpha/beta/rc)
    #   preview → preview
    # Native fingerprint changes and commits marked -apk build an APK.
    # Feature branches never OTA (last-write-wins would clobber the stream).
    if: >
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview') &&
        needs.detect.outputs.should_build != 'true') ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.publish_ota == true || inputs.republish_ota_group != '') &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview'))
    concurrency:
      # Republish must not share a group with a JS-only push OTA — the push
      # would cancel the republish before createdAt is rewritten.
      group: ci-ota-${{ github.ref }}-${{ github.event.inputs.republish_ota_group || 'publish' }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      # expo-updates compares OTA createdAt to the APK's embedded commitTime
      # (stamped during :app:createReleaseUpdatesResources). Publishing while
      # that task is still running makes Check report "up to date".
      - name: Wait for in-flight APK
        if: github.event_name != 'workflow_dispatch' || inputs.republish_ota_group == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/wait-for-in-flight-apk.sh" "$GITHUB_REF_NAME"

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.dangerouslyAllowAllBuilds=true

      - name: Build shared package
        if: github.event_name != 'workflow_dispatch' || inputs.republish_ota_group == ''
        run: pnpm --filter @ordo/shared build

      # Prebuild so the fingerprint matches the APK build (which also runs
      # prebuild). Without this, bareNativeDir (android/) differs and the
      # OTA update gets a different runtime version than the installed binary.
      - name: Expo prebuild
        if: github.event_name != 'workflow_dispatch' || inputs.republish_ota_group == ''
        working-directory: apps/mobile
        env:
          EXPO_UPDATES_CHANNEL: ${{ needs.detect.outputs.updates_channel }}
        run: pnpm exec expo prebuild --platform android --no-install

      # Install eas-cli via npm to avoid pnpm's unapproved-build-script gate
      # (eas-cli pulls dtrace-provider, whose build script pnpm would reject).
      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Republish update
        if: github.event_name == 'workflow_dispatch' && inputs.republish_ota_group != ''
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: >
          eas update:republish
          --group ${{ inputs.republish_ota_group }}
          --non-interactive
          --message "Republish so createdAt is newer than the APK embedded bundle."

      - name: Publish update
        if: github.event_name != 'workflow_dispatch' || inputs.republish_ota_group == ''
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CHANNEL: ${{ needs.detect.outputs.updates_channel }}
          EXTRA_RUNTIMES: ${{ needs.detect.outputs.extra_runtime_versions }}
        run: |
          eas update --channel "$CHANNEL" --non-interactive --auto
          # --auto addresses this commit's fingerprint. Older APKs can have a
          # different hash (e.g. package.json test lists) even when native
          # code matches. eas update has no --runtime-version flag; app.config.js
          # reads ORDO_OTA_RUNTIME_VERSION so we can retarget without dirtying git.
          for runtime in $EXTRA_RUNTIMES; do
            echo "Publishing Android bundle for APK runtime ${runtime}"
            ORDO_OTA_RUNTIME_VERSION="$runtime" eas update \
              --channel "$CHANNEL" --platform android --non-interactive \
              --message "Same JS for APK runtime ${runtime}"
          done

  build_apk:
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-deps-${{ hashFiles('apps/mobile/package.json', 'pnpm-lock.yaml') }}
          restore-keys: gradle-deps-

      - name: Cache Gradle build outputs
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: gradle-build-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.dangerouslyAllowAllBuilds=true

      - name: Build shared package
        run: pnpm --filter @ordo/shared build

      - name: Prebuild (generate native Android project)
        working-directory: apps/mobile
        env:
          EXPO_UPDATES_CHANNEL: ${{ needs.detect.outputs.updates_channel }}
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Verify OTA channel embedded
        working-directory: apps/mobile
        run: |
          CHANNEL="${{ needs.detect.outputs.updates_channel }}"
          grep -q "expo-channel-name" android/app/src/main/AndroidManifest.xml
          grep -q "$CHANNEL" android/app/src/main/AndroidManifest.xml

      - name: Build APK (dev, arm64 only)
        if: needs.detect.outputs.is_release != 'true'
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a -Pandroid.versionCode=${{ needs.detect.outputs.version_code }}

      - name: Build APKs (release, per-ABI splits + universal)
        if: needs.detect.outputs.is_release == 'true'
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -Pandroid.buildAbiSplits=true -Pandroid.versionCode=${{ needs.detect.outputs.version_code }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: ordo-apk-${{ needs.detect.outputs.updates_channel }}
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk

  release:
    needs: [detect, build_apk]
    # Attaches APKs to the GitHub Release that triggered this run.
    # Stable (Latest): tag vX.Y.Z, pre-release unchecked.
    # Early (pre-release): tag vX.Y.Z-(alpha|beta|rc)[.N], pre-release checked.
    if: needs.detect.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download APK artifact
        uses: actions/download-artifact@v6
        with:
          name: ordo-apk-${{ needs.detect.outputs.updates_channel }}
          path: apk

      - name: Rename APKs
        run: |
          VERSION="${{ needs.detect.outputs.version }}"
          cd apk
          # universal (all ABIs) -> ordo-vX.Y.Z.apk or ordo-vX.Y.Z-beta.N.apk
          if [ -f app-universal-release.apk ]; then
            mv app-universal-release.apk "ordo-v${VERSION}.apk"
          elif [ -f app-release.apk ]; then
            mv app-release.apk "ordo-v${VERSION}.apk"
          fi
          # per-ABI splits -> ordo-vX.Y.Z[-prerelease]-<abi>.apk
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            if [ -f "app-${abi}-release.apk" ]; then
              mv "app-${abi}-release.apk" "ordo-v${VERSION}-${abi}.apk"
            fi
          done
          echo "## APKs to publish:" >> "$GITHUB_STEP_SUMMARY"
          ls -1 ordo-v*.apk | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          gh release upload "$TAG" apk/ordo-v*.apk --clobber -R "$GITHUB_REPOSITORY"
