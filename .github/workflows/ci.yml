name: CI

on:
  push:
    branches: ['**']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build an arm64 v8a dev APK'
        required: false
        default: 'false'
        type: boolean

# Native GitHub Releases:
#   Latest (stable): tag vX.Y.Z, "Set as the latest release", pre-release unchecked.
#   Early: tag vX.Y.Z-alpha.N | -beta.N | -rc.N, "This is a pre-release" checked.
# Release APKs are signed with one stored upload key (alias `ordo`):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD. Missing secrets fail
#   assembleRelease instead of minting a new debug key each run.
# EAS Update channels (baked into the APK, not switched in-app):
#   production  — GitHub Latest / `main` while apps/mobile version is stable X.Y.Z
#             (release/x.y hotfix branches cut from that tag also publish here)
#   development — GitHub pre-release / `main` while version is alpha|beta|rc
#   preview     — `preview` git branch dogfood APKs only (not feature branches)
# JS-only updates on main, preview, or release/x.y of axoletlabs/ordo go to
# that stream's channel when the Android fingerprint matches the last (or
# in-flight) APK on the same branch. Forks never OTA. Release branches exist so
# a post-release hotfix cannot be blocked by
# newer native work on main: cut release/x.y at the tag commit, cherry-pick JS
# fixes onto it, tag hotfixes vX.Y.Z from it, merge back to main after each fix.
# Detect ignores packageJson:scripts and extra.ordo so a test-file list edit
# does not mint a new APK. When those sources still change the raw hash, the
# OTA job publishes to the last compatible APK runtime instead of --auto
# (which would mint a runtime no binary exists for). Gradle can still bake a
# different hash than detect (a native module rewriting its sources during
# the APK build). Fingerprint hooks plus EXPO_UPDATES_FINGERPRINT_OVERRIDE
# keep those aligned; if they still differ, extra_runtimes uses the hash
# actually embedded in the APK, not detect's hash of that commit.
# In-flight JS-only runs are not a baseline — only an APK-producing run or
# the last shipped APK.
# An in-flight SHA must be an ancestor of this commit; a later overlapping
# push is not in this clone and must not be used as the fingerprint baseline.
# The OTA job waits for that APK to finish packaging so createdAt is newer
# than the binary's embedded commitTime; expo-updates ignores older OTAs.
# Concurrency is per-job, not workflow-wide. A workflow-level group would
# cancel an in-flight APK when a later JS-only push starts OTA, leaving that
# native fingerprint with no binary.
# Server archive (same GitHub Release as the APKs):
#   package_server compiles @ordo/server, then uploads ordo-server-vX.Y.Z.tar.gz
#   (the tagged source, plus apps/server/release.json) and a sha256 file.
#   scripts/deploy-server installs that release instead of pulling a branch.
jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.info.outputs.version }}
      version_code: ${{ steps.info.outputs.version_code }}
      should_build: ${{ steps.route.outputs.should_build }}
      is_release: ${{ steps.info.outputs.is_release }}
      build_ref: ${{ steps.info.outputs.build_ref }}
      updates_channel: ${{ steps.info.outputs.updates_channel }}
      extra_runtime_versions: ${{ steps.eligibility.outputs.extra_runtime_versions }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gather trigger info
        id: info
        run: |
          VERSION=$(node -e "console.log(require('./apps/mobile/app.config.js').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          BRANCH="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "release" ]; then
            # Tag names must not select the preview stream.
            BRANCH=""
          fi
          CHANNEL=$(node "$GITHUB_WORKSPACE/.github/scripts/validate-release-tag.js" --channel "$VERSION" --branch "$BRANCH")
          echo "updates_channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "EAS Update channel: $CHANNEL (branch=${BRANCH:-none})"
          # Base versionCode is the workflow run number. Gradle multiplies by
          # 10 and adds a per-ABI offset (0-4) so split APKs stay ordered.
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "build_ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "release" ]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm for OTA eligibility check
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview' || startsWith(github.ref, 'refs/heads/release/'))
        uses: pnpm/action-setup@v5

      - name: Setup Node.js for OTA eligibility check
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview' || startsWith(github.ref, 'refs/heads/release/'))
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Check Android native fingerprint
        id: eligibility
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview' || startsWith(github.ref, 'refs/heads/release/'))
        continue-on-error: true
        # Last-resort cap if createFingerprintAsync never resolves.
        timeout-minutes: 8
        env:
          CURRENT_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Don't wait on a leftover .git/index.lock from a fingerprint child
          # that is still running git status via app.config.js.
          GIT_OPTIONAL_LOCKS: '0'
        run: |
          if [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            echo "native_changed=true" >> "$GITHUB_OUTPUT"
            echo "extra_runtime_versions=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Compare against an in-flight CI run on this stream (main or
          # preview) when one exists (an APK still building, or detect still
          # running), else the last shipped APK on the same branch. Never
          # compare preview to a production APK — the baked channel differs.
          # Parent-commit comparison is wrong: a cancelled native bump would
          # make later JS look unchanged vs parent and OTA a runtime that
          # never got a binary. An in-flight APK *will* produce that binary,
          # so a JS-only follow-up should OTA onto it instead of starting a
          # second APK.
          BASELINE_SHA="$(bash "$GITHUB_WORKSPACE/.github/scripts/apk-baseline-sha.sh" "$GITHUB_REF_NAME" || true)"
          if [[ -z "$BASELINE_SHA" ]]; then
            echo "No APK baseline on ${GITHUB_REF_NAME}; treating as native-incompatible"
            echo "native_changed=true" >> "$GITHUB_OUTPUT"
            echo "extra_runtime_versions=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Fingerprint baseline SHA: $BASELINE_SHA"
          if [[ "$BASELINE_SHA" == "$CURRENT_SHA" ]]; then
            echo "This commit is the fingerprint baseline"
            echo "native_changed=false" >> "$GITHUB_OUTPUT"
            echo "extra_runtime_versions=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${BASELINE_SHA}^{commit}" 2>/dev/null; then
            echo "Baseline ${BASELINE_SHA} is not in this clone; skipping fingerprint compare"
            echo "native_changed=false" >> "$GITHUB_OUTPUT"
            echo "extra_runtime_versions=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Isolated worktree + a wrapper that process.exit()s after JSON so
          # leftover autolinking children cannot wedge detect.
          SCRIPT="$GITHUB_WORKSPACE/.github/scripts/generate-android-fingerprint.js"
          PREV_DIR="${RUNNER_TEMP}/fp-prev"
          rm -rf "$PREV_DIR"
          if ! git worktree add --detach "$PREV_DIR" "$BASELINE_SHA"; then
            echo "Could not check out baseline ${BASELINE_SHA}; skipping fingerprint compare"
            echo "native_changed=false" >> "$GITHUB_OUTPUT"
            echo "extra_runtime_versions=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cleanup() { git worktree remove --force "$PREV_DIR" 2>/dev/null || true; }
          trap cleanup EXIT

          generate_fingerprint() {
            local dir="$1"
            local out="$2"
            echo "Installing $(git -C "$dir" rev-parse --short HEAD) in $dir"
            (cd "$dir" && pnpm install --frozen-lockfile)
            echo "Generating fingerprint for $(git -C "$dir" rev-parse --short HEAD)"
            # stdin closed: ExpoConfigLoader / autolinking inherit the Actions
            # pipe and can wait forever for EOF. timeout is a last resort if
            # createFingerprintAsync itself never resolves.
            (
              cd "$dir/apps/mobile"
              timeout --kill-after=5s 60s node "$SCRIPT" --platform android \
                < /dev/null > "$out"
            )
            echo "Wrote $out ($(wc -c < "$out") bytes)"
          }

          generate_fingerprint "$PREV_DIR" /tmp/fingerprint-previous.json
          generate_fingerprint "$GITHUB_WORKSPACE" /tmp/fingerprint-current.json

          NORMALIZE="$GITHUB_WORKSPACE/.github/scripts/normalize-android-fingerprint.jq"
          normalize_fingerprint() {
            jq -f "$NORMALIZE" "$1" > "$1.normalized"
          }

          # extra.ordo and packageJson:scripts change every JS commit / test file
          # but do not affect native compatibility. Stripping them for routing
          # avoids minting a new APK (and abandoning the previous runtime).
          normalize_fingerprint /tmp/fingerprint-previous.json
          normalize_fingerprint /tmp/fingerprint-current.json

          extra_runtimes=()
          current_hash="$(jq -r '.hash' /tmp/fingerprint-current.json)"
          add_extra_runtime() {
            local runtime="$1"
            local sha="$2"
            [[ -z "$runtime" || "$runtime" == "null" ]] && return 0
            case " ${extra_runtimes[*]} " in
              *" $runtime "*) return 0 ;;
            esac
            echo "Compatible APK runtime ${runtime} from ${sha}"
            extra_runtimes+=("$runtime")
          }
          collect_runtime_if_compatible() {
            local sha="$1"
            local fp="$2"
            local hash embedded
            hash="$(jq -r '.hash' "$fp")"
            if [[ -z "$hash" || "$hash" == "null" ]]; then
              return 0
            fi
            # Detect hash matching is not enough: the APK may have baked
            # Gradle's post-compile fingerprint. Pin to that when it differs.
            if [[ "$hash" == "$current_hash" ]]; then
              embedded="$(bash "$GITHUB_WORKSPACE/.github/scripts/apk-embedded-runtime.sh" --sha "$sha" || true)"
              if [[ -n "$embedded" && "$embedded" != "$current_hash" ]]; then
                add_extra_runtime "$embedded" "$sha"
              fi
              return 0
            fi
            normalize_fingerprint "$fp"
            if cmp -s /tmp/fingerprint-current.json.normalized "$fp.normalized"; then
              embedded="$(bash "$GITHUB_WORKSPACE/.github/scripts/apk-embedded-runtime.sh" --sha "$sha" || true)"
              add_extra_runtime "${embedded:-$hash}" "$sha"
            else
              echo "Skipping APK ${sha}: native fingerprint differs"
            fi
          }

          if cmp -s /tmp/fingerprint-previous.json.normalized /tmp/fingerprint-current.json.normalized; then
            echo "native_changed=false" >> "$GITHUB_OUTPUT"
            # Shipped binaries first. An in-flight JS commit can share a
            # normalized fingerprint but a different raw hash — that hash is
            # not an APK runtime and must not block the last-APK scan.
            while read -r apk_sha; do
              [[ -z "$apk_sha" ]] && continue
              if [[ "$apk_sha" == "$CURRENT_SHA" || "$apk_sha" == "$BASELINE_SHA" ]]; then
                continue
              fi
              extra_dir="${RUNNER_TEMP}/fp-${apk_sha:0:8}"
              rm -rf "$extra_dir"
              if ! git cat-file -e "${apk_sha}^{commit}" 2>/dev/null; then
                echo "Skipping APK ${apk_sha}: commit is not in this clone"
                continue
              fi
              if ! git worktree add --detach "$extra_dir" "$apk_sha"; then
                echo "Skipping APK ${apk_sha}: worktree failed"
                continue
              fi
              if generate_fingerprint "$extra_dir" "/tmp/fingerprint-${apk_sha}.json"; then
                collect_runtime_if_compatible "$apk_sha" "/tmp/fingerprint-${apk_sha}.json"
              else
                echo "Skipping APK ${apk_sha}: fingerprint failed"
              fi
              git worktree remove --force "$extra_dir" 2>/dev/null || true
              if (( ${#extra_runtimes[@]} >= 1 )); then
                break
              fi
            done < <(bash "$GITHUB_WORKSPACE/.github/scripts/last-apk-shas.sh" "$GITHUB_REF_NAME" 3 || true)
            # Upcoming APK (in-flight native bump) if its raw hash differs.
            collect_runtime_if_compatible "$BASELINE_SHA" /tmp/fingerprint-previous.json
          else
            echo "native_changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "extra_runtime_versions=${extra_runtimes[*]}" >> "$GITHUB_OUTPUT"

      - name: Select OTA or APK build
        id: route
        env:
          BUILD_INPUT: ${{ inputs.build_apk }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.release.body || '' }}
          # Treat an inconclusive fingerprint check as native-incompatible.
          NATIVE_CHANGED: ${{ steps.eligibility.outputs.native_changed || 'true' }}
        run: |
          MSG=$(echo "$COMMIT_MSG" | head -1)
          REF="${{ github.ref }}"
          EVENT="${{ github.event_name }}"
          stream=false
          case "$REF" in
            refs/heads/main|refs/heads/preview|refs/heads/release/*) stream=true ;;
          esac
          # release/* is included on purpose. A native change on a maintenance
          # branch has to mint an APK. An OTA there would target a runtime
          # that no installed binary has.
          if [[ "$EVENT" = "release" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT" = "workflow_dispatch" && "$BUILD_INPUT" = "true" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [[ "$MSG" == *-apk ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT" = "push" && "$stream" = "true" && "$NATIVE_CHANGED" = "true" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release tag
        if: github.event_name == 'release'
        run: |
          node "$GITHUB_WORKSPACE/.github/scripts/validate-release-tag.js" \
            "${{ github.event.release.tag_name }}" \
            "${{ steps.info.outputs.version }}" \
            "${{ github.event.release.prerelease }}"

  analyze:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: ci-analyze-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build shared package
        run: pnpm --filter @ordo/shared build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test && pnpm test:scripts

  supply-chain:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    concurrency:
      group: ci-supply-chain-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          # Audit does not install; v5 would otherwise auto-cache pnpm and
          # fail the post step because the store path does not exist.
          package-manager-cache: false

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Scan the tree and recent history for secrets
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir --redact --no-banner --max-decode-depth 0 --max-target-megabytes 2
          /tmp/gitleaks git --redact --no-banner --max-decode-depth 0 --max-target-megabytes 2 --log-opts="-n 200"

  ota:
    needs: [detect, supply-chain]
    # Publishes a JS-only update to this stream's channel:
    #   main       → production (stable version) or development (alpha/beta/rc)
    #   preview    → preview
    #   release/*  → production (hotfix line for the shipped stable)
    # Native fingerprint changes and commits marked -apk build an APK.
    # Feature branches never OTA (last-write-wins would clobber the stream).
    # Forks never OTA even if they have a main branch.
    if: >-
      github.repository == 'axoletlabs/ordo' &&
      github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' ||
         github.ref == 'refs/heads/preview' ||
         startsWith(github.ref, 'refs/heads/release/')) &&
        needs.detect.outputs.should_build != 'true'
    concurrency:
      group: ci-ota-${{ github.ref }}-publish
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      # expo-updates compares OTA createdAt to the APK's embedded commitTime
      # (stamped during :app:createReleaseUpdatesResources). Publishing while
      # that task is still running makes Check report "up to date".
      - name: Wait for in-flight APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/wait-for-in-flight-apk.sh" "$GITHUB_REF_NAME"

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @ordo/shared build

      # Prebuild so the fingerprint matches the APK build (which also runs
      # prebuild). Without this, bareNativeDir (android/) differs and the
      # OTA update gets a different runtime version than the installed binary.
      - name: Expo prebuild
        working-directory: apps/mobile
        env:
          EXPO_UPDATES_CHANNEL: ${{ needs.detect.outputs.updates_channel }}
        run: pnpm exec expo prebuild --platform android --no-install

      # Install eas-cli via npm to avoid pnpm's unapproved-build-script gate
      # (eas-cli pulls dtrace-provider, whose build script pnpm would reject).
      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Publish update
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CHANNEL: ${{ needs.detect.outputs.updates_channel }}
          EXTRA_RUNTIMES: ${{ needs.detect.outputs.extra_runtime_versions }}
        run: |
          # Pin to a shipped APK runtime when detect's hash is not the
          # hash Gradle baked in, or when extra.ordo / scripts drifted.
          # --auto would publish detect's fingerprint — a runtime no
          # installed binary uses — and devices would never see it.
          if [[ -n "$EXTRA_RUNTIMES" ]]; then
            first=1
            for runtime in $EXTRA_RUNTIMES; do
              if [[ "$first" -eq 1 ]]; then
                echo "Publishing JS to APK runtime ${runtime}"
                ORDO_OTA_RUNTIME_VERSION="$runtime" eas update \
                  --channel "$CHANNEL" --platform android --non-interactive \
                  --message "JS for APK runtime ${runtime}"
                first=0
              else
                echo "Reusing bundle for APK runtime ${runtime}"
                ORDO_OTA_RUNTIME_VERSION="$runtime" eas update \
                  --channel "$CHANNEL" --platform android --skip-bundler --non-interactive \
                  --message "Same JS for APK runtime ${runtime}"
              fi
            done
          else
            eas update \
              --channel "$CHANNEL" --platform android --non-interactive --auto
          fi

  build_apk:
    needs: [detect, supply-chain]
    if: github.repository == 'axoletlabs/ordo' && needs.detect.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ORDO_UPLOAD_STORE_TYPE: PKCS12
      ORDO_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ORDO_UPLOAD_KEY_ALIAS: ordo
      ORDO_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-deps-${{ hashFiles('apps/mobile/package.json', 'pnpm-lock.yaml') }}
          restore-keys: gradle-deps-

      - name: Cache Gradle build outputs
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: gradle-build-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @ordo/shared build

      - name: Prebuild (generate native Android project)
        working-directory: apps/mobile
        env:
          EXPO_UPDATES_CHANNEL: ${{ needs.detect.outputs.updates_channel }}
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Verify OTA channel embedded
        working-directory: apps/mobile
        run: |
          CHANNEL="${{ needs.detect.outputs.updates_channel }}"
          grep -q "expo-channel-name" android/app/src/main/AndroidManifest.xml
          grep -q "$CHANNEL" android/app/src/main/AndroidManifest.xml

      # Hash before Gradle compiles. expo-updates otherwise fingerprints
      # after modules like masked-view rewrite their own sources, so the
      # APK runtime would not match detect / eas update --auto.
      - name: Fingerprint Android runtime
        working-directory: apps/mobile
        run: |
          node "$GITHUB_WORKSPACE/.github/scripts/generate-android-fingerprint.js" --platform android \
            > /tmp/android-fingerprint.json
          HASH="$(jq -r '.hash' /tmp/android-fingerprint.json)"
          echo "$HASH" > "$RUNNER_TEMP/android-runtime-version.txt"
          echo "EXPO_UPDATES_FINGERPRINT_OVERRIDE=$HASH" >> "$GITHUB_ENV"
          echo "Android runtime (pre-Gradle): $HASH"

      - name: Upload Android runtime version
        uses: actions/upload-artifact@v6
        with:
          name: android-runtime-version
          path: ${{ runner.temp }}/android-runtime-version.txt
          retention-days: 90

      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ORDO_UPLOAD_STORE_PASSWORD" ]; then
            echo "::error::Set ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repository secrets so release APKs share one upload key."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/ordo-upload.p12"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          if [ ! -s "$KEYSTORE" ]; then
            echo "::error::Decoded ANDROID_KEYSTORE_BASE64 is empty."
            exit 1
          fi
          echo "ORDO_UPLOAD_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build APK (dev, arm64 only)
        if: needs.detect.outputs.is_release != 'true'
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a -Pandroid.versionCode=${{ needs.detect.outputs.version_code }}

      - name: Build APKs (release, per-ABI splits + universal)
        if: needs.detect.outputs.is_release == 'true'
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -Pandroid.buildAbiSplits=true -Pandroid.versionCode=${{ needs.detect.outputs.version_code }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: ordo-apk-${{ needs.detect.outputs.updates_channel }}
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk

  package_server:
    needs: [detect, supply-chain]
    if: github.repository == 'axoletlabs/ordo' && needs.detect.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @ordo/shared build

      - name: Generate Prisma client
        run: pnpm --filter @ordo/server db:generate

      - name: Build server
        run: pnpm --filter @ordo/server build

      # The archive is source at this tag, not dist/. The host compiles
      # native modules. The build above is the gate: a release that does not
      # compile does not get a server asset.
      - name: Package server archive
        run: |
          bash .github/scripts/package-server-archive.sh \
            "${{ needs.detect.outputs.version }}" \
            "${{ github.event.release.tag_name }}" \
            "${{ github.sha }}" \
            "$RUNNER_TEMP/server-release"

      - name: Upload server archive to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          DIR="$RUNNER_TEMP/server-release"
          ok=0
          for attempt in 1 2 3; do
            if gh release upload "$TAG" "$DIR"/ordo-server-v*.tar.gz "$DIR"/ordo-server-v*.tar.gz.sha256 --clobber -R "$GITHUB_REPOSITORY"; then
              ok=1
              break
            fi
            echo "release upload failed (attempt ${attempt}), retrying..."
            sleep 5
          done
          if [[ "$ok" != 1 ]]; then
            echo "::error::Could not upload the server archive to ${TAG}"
            exit 1
          fi
          {
            echo "## Server archive"
            ls -1 "$DIR"/ordo-server-v*.tar.gz | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: [detect, build_apk]
    # Attaches APKs to the GitHub Release that triggered this run.
    # Stable (Latest): tag vX.Y.Z, pre-release unchecked.
    # Early (pre-release): tag vX.Y.Z-(alpha|beta|rc)[.N], pre-release checked.
    if: needs.detect.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download APK artifact
        uses: actions/download-artifact@v6
        with:
          name: ordo-apk-${{ needs.detect.outputs.updates_channel }}
          path: apk

      - name: Rename APKs
        run: |
          VERSION="${{ needs.detect.outputs.version }}"
          cd apk
          # universal (all ABIs) -> ordo-vX.Y.Z.apk or ordo-vX.Y.Z-beta.N.apk
          if [ -f app-universal-release.apk ]; then
            mv app-universal-release.apk "ordo-v${VERSION}.apk"
          elif [ -f app-release.apk ]; then
            mv app-release.apk "ordo-v${VERSION}.apk"
          fi
          # per-ABI splits -> ordo-vX.Y.Z[-prerelease]-<abi>.apk
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            if [ -f "app-${abi}-release.apk" ]; then
              mv "app-${abi}-release.apk" "ordo-v${VERSION}-${abi}.apk"
            fi
          done
          echo "## APKs to publish:" >> "$GITHUB_STEP_SUMMARY"
          ls -1 ordo-v*.apk | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          gh release upload "$TAG" apk/ordo-v*.apk --clobber -R "$GITHUB_REPOSITORY"
