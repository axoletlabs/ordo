name: CI

on:
  push:
    branches: ['**']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build an arm64 v8a dev APK'
        required: false
        default: 'false'
        type: boolean

# Full release/OTA design: docs/RELEASES.md. Invariants a CI edit must keep:
# - main never publishes a version; each version is its own release/x.y.z
#   branch and vX.Y.Z tag, published from that branch (validated below).
# - OTA (JS-only) runs only on main and release/* of axoletlabs/ordo; every
#   other event builds an APK or stops. Forks never OTA.
# - JS-only pushes OTA onto the fingerprint of a shipped (or in-flight) APK
#   on the same branch; a native fingerprint change mints a new APK.
# - Concurrency groups are per-job, never workflow-wide: a workflow-level
#   group would cancel an in-flight APK when a later JS-only push starts an
#   OTA, leaving that native fingerprint with no binary.
permissions:
  contents: read

jobs:
  detect:
    if: github.event_name != 'pull_request' && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.info.outputs.version }}
      version_code: ${{ steps.info.outputs.version_code }}
      should_build: ${{ steps.route.outputs.should_build }}
      is_release: ${{ steps.info.outputs.is_release }}
      build_ref: ${{ steps.info.outputs.build_ref }}
      updates_channel: ${{ steps.info.outputs.updates_channel }}
      extra_runtime_versions: ${{ steps.eligibility.outputs.extra_runtime_versions }}
      baseline_sha: ${{ steps.eligibility.outputs.baseline_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gather trigger info
        id: info
        run: |
          VERSION=$(node -e "console.log(require('./apps/mobile/app.config.js').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          BRANCH="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "release" ]; then
            # A published tag takes its channel from the version, then the
            # validate step requires it was published from release/x.y.z.
            BRANCH=""
          fi
          CHANNEL=$(node "$GITHUB_WORKSPACE/.github/scripts/validate-release-tag.js" --channel "$VERSION" --branch "$BRANCH")
          echo "updates_channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "EAS Update channel: $CHANNEL (branch=${BRANCH:-none})"
          # Every APK of the build — universal and all ABI splits — shares the
          # raw run number. Android treats an equal-code install as a replace,
          # and later runs outrank earlier builds because the counter only
          # grows. A workflow re-run reuses its own code.
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "build_ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "release" ]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      # The eligibility check installs dependencies in two worktrees, so it
      # needs the pnpm store cache; other detect paths skip setup entirely.
      - name: Setup pnpm and Node.js for the fingerprint check
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
        uses: ./.github/actions/setup-pnpm-node

      - name: Check Android native fingerprint
        id: eligibility
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
        continue-on-error: true
        # Last-resort cap if createFingerprintAsync never resolves.
        timeout-minutes: 8
        env:
          CURRENT_SHA: ${{ github.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Don't wait on a leftover .git/index.lock from a fingerprint child
          # that is still running git status via app.config.js.
          GIT_OPTIONAL_LOCKS: '0'
          ORDO_BUILD_BRANCH: ${{ github.ref_name }}
          EXPO_UPDATES_CHANNEL: ${{ steps.info.outputs.updates_channel }}
          APP_VERSION: ${{ steps.info.outputs.version }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/check-android-fingerprint.sh"

      - name: Select OTA or APK build
        id: route
        env:
          BUILD_INPUT: ${{ inputs.build_apk }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.release.body || '' }}
          # Treat an inconclusive fingerprint check as native-incompatible.
          NATIVE_CHANGED: ${{ steps.eligibility.outputs.native_changed || 'true' }}
        run: |
          MSG="${COMMIT_MSG%%$'\n'*}"
          REF="$GITHUB_REF"
          EVENT="$GITHUB_EVENT_NAME"
          stream=false
          case "$REF" in
            refs/heads/main|refs/heads/release/*) stream=true ;;
          esac
          # release/* is included on purpose. A native change on a maintenance
          # branch has to mint an APK. An OTA there would target a runtime
          # that no installed binary has.
          if [[ "$EVENT" = "release" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT" = "workflow_dispatch" && "$BUILD_INPUT" = "true" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [[ "$MSG" == *-apk ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT" = "push" && "$stream" = "true" && "$NATIVE_CHANGED" = "true" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release tag
        if: github.event_name == 'release'
        env:
          GITHUB_SHA: ${{ github.sha }}
          TAG: ${{ github.event.release.tag_name }}
          TARGET: ${{ github.event.release.target_commitish }}
          VERSION: ${{ steps.info.outputs.version }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node "$GITHUB_WORKSPACE/.github/scripts/validate-release-tag.js" \
            "$TAG" "$VERSION" "$PRERELEASE"
          bash "$GITHUB_WORKSPACE/.github/scripts/require-release-branch.sh" "$TAG" "$TARGET"

  analyze:
    if: '!github.event.deleted'
    # Unique per run: a later push must never cancel this gate while the
    # APK it approved is still building (see the header note on concurrency).
    concurrency:
      group: ci-analyze-${{ github.ref }}-${{ github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build shared package
        run: pnpm --filter @ordo/shared build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test && pnpm --filter @ordo/mobile test:material && pnpm --filter @ordo/mobile test:performance && pnpm --filter @ordo/mobile test:reader-performance && pnpm --filter @ordo/mobile test:updates && pnpm test:scripts

  supply-chain:
    if: '!github.event.deleted'
    concurrency:
      group: ci-supply-chain-${{ github.ref }}-${{ github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Audit does not install, so skip the pnpm store cache: setup-node
      # would fail its post step saving a store path that does not exist.
      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node
        with:
          pnpm-cache: false

      - name: Lint CI shell scripts
        run: shellcheck -S warning .github/scripts/*.sh

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Scan the tree and recent history for secrets
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir --redact --no-banner --max-decode-depth 0 --max-target-megabytes 2
          /tmp/gitleaks git --redact --no-banner --max-decode-depth 0 --max-target-megabytes 2 --log-opts="-n 200"

  ota:
    needs: [detect, analyze, supply-chain]
    # Publishes a JS-only update to this stream's channel:
    #   main       → development (never a version release)
    #   release/x.y.z → production for stable, early-access for alpha/beta/rc
    # Native fingerprint changes and commits marked -apk build an APK.
    # Feature branches never OTA (last-write-wins would clobber the stream).
    # Forks never OTA even if they have a main branch.
    if: >-
      github.repository == 'axoletlabs/ordo' &&
      github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' ||
         startsWith(github.ref, 'refs/heads/release/')) &&
        needs.detect.outputs.should_build != 'true'
    concurrency:
      group: ci-ota-${{ github.ref }}-publish
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPO_UPDATES_CHANNEL: ${{ needs.detect.outputs.updates_channel }}
      ORDO_BUILD_BRANCH: ${{ github.ref_name }}
      APP_VERSION: ${{ needs.detect.outputs.version }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      # expo-updates compares OTA createdAt to the APK's embedded commitTime
      # (stamped during :app:createReleaseUpdatesResources). Publishing while
      # that task is still running makes Check report "up to date".
      - name: Wait for in-flight APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/wait-for-in-flight-apk.sh" "$GITHUB_REF_NAME"

      - name: Resolve the actual APK runtime after the build finishes
        id: runtime
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASELINE_SHA: ${{ needs.detect.outputs.baseline_sha }}
          EXTRA_RUNTIMES: ${{ needs.detect.outputs.extra_runtime_versions }}
        run: |
          RUNTIME=$(bash "$GITHUB_WORKSPACE/.github/scripts/apk-embedded-runtime.sh" --sha "$BASELINE_SHA" --branch "$GITHUB_REF_NAME")
          if [[ ! "$RUNTIME" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::No successful APK runtime for the fingerprint baseline; refusing an unreachable OTA"
            exit 1
          fi
          echo "versions=$RUNTIME $EXTRA_RUNTIMES" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @ordo/shared build

      # Prebuild so the fingerprint matches the APK build (which also runs
      # prebuild). Without this, bareNativeDir (android/) differs and the
      # OTA update gets a different runtime version than the installed binary.
      - name: Expo prebuild
        working-directory: apps/mobile
        env:
          EXPO_UPDATES_CHANNEL: ${{ needs.detect.outputs.updates_channel }}
        run: pnpm exec expo prebuild --platform android --no-install

      # Install eas-cli via npm to avoid pnpm's unapproved-build-script gate
      # (eas-cli pulls dtrace-provider, whose build script pnpm would reject).
      - name: Install EAS CLI
        run: npm install -g eas-cli@24.8.0

      - name: Ensure the updates channel exists
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/ensure-updates-channel.sh"

      - name: Publish update
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CHANNEL: ${{ needs.detect.outputs.updates_channel }}
          EXPO_UPDATES_CHANNEL: ${{ needs.detect.outputs.updates_channel }}
          EXTRA_RUNTIMES: ${{ steps.runtime.outputs.versions }}
        run: |
          ENVIRONMENT=development
          if [[ "$CHANNEL" == "production" ]]; then ENVIRONMENT=production; fi
          if [[ "$CHANNEL" == "early-access" ]]; then ENVIRONMENT=preview; fi
          # Pin to a shipped APK runtime when detect's hash is not the
          # hash Gradle baked in, or when extra.ordo / scripts drifted.
          # --auto would publish detect's fingerprint — a runtime no
          # installed binary uses — and devices would never see it.
          if [[ -n "$EXTRA_RUNTIMES" ]]; then
            first=1
            declare -A published=()
            for runtime in $EXTRA_RUNTIMES; do
              [[ -n "${published[$runtime]+x}" ]] && continue
              [[ "$runtime" =~ ^[a-f0-9]{40}$ ]] || exit 1
              published[$runtime]=1
              if [[ "$first" -eq 1 ]]; then
                echo "Publishing JS to APK runtime ${runtime}"
                ORDO_OTA_RUNTIME_VERSION="$runtime" eas update \
                  --channel "$CHANNEL" --platform android --non-interactive \
                  --environment "$ENVIRONMENT" \
                  --message "JS for APK runtime ${runtime}"
                first=0
              else
                echo "Reusing bundle for APK runtime ${runtime}"
                ORDO_OTA_RUNTIME_VERSION="$runtime" eas update \
                  --channel "$CHANNEL" --platform android --skip-bundler --non-interactive \
                  --environment "$ENVIRONMENT" \
                  --message "Same JS for APK runtime ${runtime}"
              fi
            done
          else
            eas update \
              --channel "$CHANNEL" --platform android --non-interactive --auto --environment "$ENVIRONMENT"
          fi

  build_apk:
    needs: [detect, analyze, supply-chain]
    if: github.repository == 'axoletlabs/ordo' && needs.detect.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      EXPO_UPDATES_CHANNEL: ${{ needs.detect.outputs.updates_channel }}
      ORDO_BUILD_BRANCH: ${{ github.ref_name }}
      ORDO_ENABLE_CCACHE: '1'
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      ORDO_UPLOAD_STORE_TYPE: PKCS12
      ORDO_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ORDO_UPLOAD_KEY_ALIAS: ordo
      ORDO_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-deps-${{ hashFiles('apps/mobile/package.json', 'pnpm-lock.yaml') }}
          restore-keys: gradle-deps-

      - name: Cache Gradle build outputs
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: gradle-build-

      # The C++ layer is the bulk of assembleRelease and is recompiled from
      # scratch on every fresh checkout. ccache carries it across runs; fresh
      # runners get new compiler mtimes, so verify the compiler by content.
      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: /home/runner/.ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Set up ccache
        run: |
          command -v ccache >/dev/null || sudo apt-get install -y ccache
          ccache --set-config=max_size=3G
          ccache --zero-stats >/dev/null

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @ordo/shared build

      - name: Install EAS CLI
        run: npm install -g eas-cli@24.8.0

      - name: Ensure the updates channel exists
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/ensure-updates-channel.sh"

      - name: Prebuild (generate native Android project)
        working-directory: apps/mobile
        env:
          EXPO_UPDATES_CHANNEL: ${{ needs.detect.outputs.updates_channel }}
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Verify OTA channel embedded
        working-directory: apps/mobile
        run: |
          CHANNEL="${{ needs.detect.outputs.updates_channel }}"
          grep -q "expo-channel-name" android/app/src/main/AndroidManifest.xml
          grep -q "$CHANNEL" android/app/src/main/AndroidManifest.xml

      # Hash before Gradle compiles. expo-updates otherwise fingerprints
      # after modules like masked-view rewrite their own sources, so the
      # APK runtime would not match detect / eas update --auto.
      - name: Fingerprint Android runtime
        working-directory: apps/mobile
        run: |
          node "$GITHUB_WORKSPACE/.github/scripts/generate-android-fingerprint.js" --platform android \
            > /tmp/android-fingerprint.json
          HASH="$(jq -r '.hash' /tmp/android-fingerprint.json)"
          echo "$HASH" > "$RUNNER_TEMP/android-runtime-version.txt"
          echo "EXPO_UPDATES_FINGERPRINT_OVERRIDE=$HASH" >> "$GITHUB_ENV"
          echo "Android runtime (pre-Gradle): $HASH"

      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/restore-upload-keystore.sh"

      - name: Build APK (dev, arm64 only)
        if: needs.detect.outputs.is_release != 'true'
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a -Pandroid.versionCode=${{ needs.detect.outputs.version_code }}

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats

      - name: Build APKs (release, per-ABI splits + universal)
        if: needs.detect.outputs.is_release == 'true'
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -Pandroid.buildAbiSplits=true -Pandroid.versionCode=${{ needs.detect.outputs.version_code }}

      - name: Verify packaged APK signing, versions, runtime and channel
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          BASE_CODE: ${{ needs.detect.outputs.version_code }}
          IS_RELEASE: ${{ needs.detect.outputs.is_release }}
        run: |
          args=()
          [[ "$IS_RELEASE" == "true" ]] && args+=(--release)
          python3 .github/scripts/verify-apks.py apps/mobile/android/app/build/outputs/apk/release \
            --version "$VERSION" --base-code "$BASE_CODE" \
            --runtime "$EXPO_UPDATES_FINGERPRINT_OVERRIDE" --channel "$EXPO_UPDATES_CHANNEL" "${args[@]}"

      # apk-embedded-runtime.sh downloads this artifact to route later OTAs;
      # keep it long enough to cover APKs still in users' hands.
      - name: Upload verified Android runtime version
        uses: actions/upload-artifact@v6
        with:
          name: android-runtime-version
          path: ${{ runner.temp }}/android-runtime-version.txt
          retention-days: 90
          overwrite: true

      # Debug APKs are ephemeral; published APKs live on the GitHub Release.
      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ordo-apk-${{ needs.detect.outputs.updates_channel }}
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
          overwrite: true

  package_server:
    needs: [detect, analyze, supply-chain]
    if: github.repository == 'axoletlabs/ordo' && needs.detect.outputs.is_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @ordo/shared build

      - name: Generate Prisma client
        run: pnpm --filter @ordo/server db:generate

      - name: Build server
        run: pnpm --filter @ordo/server build

      # The archive is source at this tag, not dist/. The host compiles
      # native modules. The build above is the gate: a release that does not
      # compile does not get a server asset.
      - name: Package server archive
        run: |
          bash .github/scripts/package-server-archive.sh \
            "${{ needs.detect.outputs.version }}" \
            "${{ github.event.release.tag_name }}" \
            "${{ github.sha }}" \
            "$RUNNER_TEMP/server-release"

      - name: Upload server archive to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          DIR="$RUNNER_TEMP/server-release"
          ok=0
          for attempt in 1 2 3; do
            if bash .github/scripts/upload-release-assets.sh "$TAG" "$DIR"/ordo-server-v*.tar.gz "$DIR"/ordo-server-v*.tar.gz.sha256; then
              ok=1
              break
            fi
            echo "release upload failed (attempt ${attempt}), retrying..."
            sleep 5
          done
          if [[ "$ok" != 1 ]]; then
            echo "::error::Could not upload the server archive to ${TAG}"
            exit 1
          fi
          {
            echo "## Server archive"
            find "$DIR" -maxdepth 1 -name 'ordo-server-v*.tar.gz' -printf '%f\n' | sort | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: [detect, build_apk, package_server]
    # Attaches APKs to the GitHub Release that triggered this run.
    # Stable (Latest): tag vX.Y.Z, pre-release unchecked.
    # Early (pre-release): tag vX.Y.Z-(alpha|beta|rc)[.N], pre-release checked.
    if: needs.detect.outputs.is_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download APK artifact
        uses: actions/download-artifact@v6
        with:
          name: ordo-apk-${{ needs.detect.outputs.updates_channel }}
          path: apk

      - name: Rename APKs
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: bash .github/scripts/rename-release-apks.sh apk "$VERSION"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          bash .github/scripts/upload-release-assets.sh "$TAG" apk/ordo-v*.apk
