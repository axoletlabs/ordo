name: CI

on:
  push:
    branches: ['**']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build an arm64 dev APK'
        required: false
        default: 'false'
        type: boolean
      publish_ota:
        description: 'Publish an EAS Update to the production channel'
        required: false
        default: 'false'
        type: boolean

# Concurrency is per-job, not workflow-wide. A workflow-level group would
# cancel an in-flight APK when a later JS-only push starts OTA, leaving that
# native fingerprint with no binary.
jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.info.outputs.version }}
      version_code: ${{ steps.info.outputs.version_code }}
      should_build: ${{ steps.route.outputs.should_build }}
      is_release: ${{ steps.info.outputs.is_release }}
      build_ref: ${{ steps.info.outputs.build_ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gather trigger info
        id: info
        run: |
          VERSION=$(node -e "console.log(require('./apps/mobile/app.config.js').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # versionCode scaled by 10000 so per-ABI versionCode offsets from
          # splits.abi can never invert ordering between builds.
          echo "version_code=$(( ${{ github.run_number }} * 10000 ))" >> "$GITHUB_OUTPUT"
          echo "build_ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "release" ]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm for OTA eligibility check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: pnpm/action-setup@v5

      - name: Setup Node.js for OTA eligibility check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Check Android native fingerprint
        id: eligibility
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        # Last-resort cap if createFingerprintAsync never resolves. The
        # wrapper process.exit()s after JSON so this should not fire.
        timeout-minutes: 3
        env:
          CURRENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Don't wait on a leftover .git/index.lock from a fingerprint child
          # that is still running git status via app.config.js.
          GIT_OPTIONAL_LOCKS: '0'
        run: |
          if [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            echo "native_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Compare against the last shipped APK, not github.event.before.
          # A hung/cancelled native bump leaves later JS commits looking
          # unchanged vs their parent (both already have the new module) and
          # would OTA a runtime that never got a binary.
          BASELINE_SHA="$(bash "$GITHUB_WORKSPACE/.github/scripts/last-successful-apk-sha.sh" || true)"
          if [[ -z "$BASELINE_SHA" ]]; then
            echo "No successful APK on main; treating as native-incompatible"
            echo "native_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Last successful APK SHA: $BASELINE_SHA"
          if [[ "$BASELINE_SHA" == "$CURRENT_SHA" ]]; then
            echo "This commit already has an APK"
            echo "native_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Isolated worktree + a wrapper that process.exit()s after JSON so
          # leftover autolinking children cannot wedge detect.
          SCRIPT="$GITHUB_WORKSPACE/.github/scripts/generate-android-fingerprint.js"
          PREV_DIR="${RUNNER_TEMP}/fp-prev"
          rm -rf "$PREV_DIR"
          git worktree add --detach "$PREV_DIR" "$BASELINE_SHA"
          cleanup() { git worktree remove --force "$PREV_DIR" 2>/dev/null || true; }
          trap cleanup EXIT

          generate_fingerprint() {
            local dir="$1"
            local out="$2"
            echo "Installing $(git -C "$dir" rev-parse --short HEAD) in $dir"
            (cd "$dir" && pnpm install --frozen-lockfile --config.dangerouslyAllowAllBuilds=true)
            echo "Generating fingerprint for $(git -C "$dir" rev-parse --short HEAD)"
            # stdin closed: ExpoConfigLoader / autolinking inherit the Actions
            # pipe and can wait forever for EOF. timeout is a last resort if
            # createFingerprintAsync itself never resolves.
            (
              cd "$dir/apps/mobile"
              timeout --kill-after=5s 60s node "$SCRIPT" --platform android \
                < /dev/null > "$out"
            )
            echo "Wrote $out ($(wc -c < "$out") bytes)"
          }

          generate_fingerprint "$PREV_DIR" /tmp/fingerprint-previous.json
          generate_fingerprint "$GITHUB_WORKSPACE" /tmp/fingerprint-current.json

          # Build metadata changes every commit but does not affect native compatibility.
          for fingerprint in /tmp/fingerprint-previous.json /tmp/fingerprint-current.json; do
            jq 'del(.hash) | .sources |= map(if .type == "contents" and .id == "expoConfig" then .contents |= (fromjson | del(.extra.ordo) | tojson) | del(.hash) else . end)' \
              "$fingerprint" > "$fingerprint.normalized"
          done

          if cmp -s /tmp/fingerprint-previous.json.normalized /tmp/fingerprint-current.json.normalized; then
            echo "native_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "native_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Select OTA or APK build
        id: route
        env:
          BUILD_INPUT: ${{ inputs.build_apk }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.release.body || '' }}
          # Treat an inconclusive fingerprint check as native-incompatible.
          NATIVE_CHANGED: ${{ steps.eligibility.outputs.native_changed || 'true' }}
        run: |
          MSG=$(echo "$COMMIT_MSG" | head -1)
          if [[ "${{ github.event_name }}" = "release" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" = "workflow_dispatch" && "$BUILD_INPUT" = "true" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [[ "$MSG" == *-apk ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" = "push" && "${{ github.ref }}" = "refs/heads/main" && "$NATIVE_CHANGED" = "true" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release tag matches app version
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          EXPECTED="v${{ steps.info.outputs.version }}"
          if [[ "$TAG" != "$EXPECTED" ]]; then
            echo "::error::Release tag '$TAG' does not match app version '$EXPECTED'"
            exit 1
          fi

  analyze:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    concurrency:
      group: ci-analyze-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.dangerouslyAllowAllBuilds=true

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build shared package
        run: pnpm --filter @ordo/shared build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test

  ota:
    needs: [detect, analyze]
    # Publishes a JS-only update (EAS Update) to the production channel on
    # OTA-eligible pushes to main. Native fingerprint changes and commits
    # explicitly marked with -apk are routed to an installable APK instead.
    # Waits for analyze so a typecheck failure cannot ship an update (this
    # happened on 2026-09-06: analyze failed, OTA still published).
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect.outputs.should_build != 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish_ota == true)
    concurrency:
      group: ci-ota-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.dangerouslyAllowAllBuilds=true

      - name: Build shared package
        run: pnpm --filter @ordo/shared build

      # Prebuild so the fingerprint matches the APK build (which also runs
      # prebuild). Without this, bareNativeDir (android/) differs and the
      # OTA update gets a different runtime version than the installed binary.
      - name: Expo prebuild
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install

      # Install eas-cli via npm to avoid pnpm's unapproved-build-script gate
      # (eas-cli pulls dtrace-provider, whose build script pnpm would reject).
      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Publish update
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas update --channel production --non-interactive --auto

  build_apk:
    needs: [detect, analyze]
    if: needs.detect.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-deps-${{ hashFiles('apps/mobile/package.json', 'pnpm-lock.yaml') }}
          restore-keys: gradle-deps-

      - name: Cache Gradle build outputs
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: gradle-build-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.dangerouslyAllowAllBuilds=true

      - name: Build shared package
        run: pnpm --filter @ordo/shared build

      - name: Prebuild (generate native Android project)
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Verify OTA channel embedded
        working-directory: apps/mobile
        run: grep -q "expo-channel-name" android/app/src/main/AndroidManifest.xml

      - name: Build APK (dev, arm64 only)
        if: needs.detect.outputs.is_release != 'true'
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a -Pandroid.versionCode=${{ needs.detect.outputs.version_code }}

      - name: Build APKs (release, per-ABI splits + universal)
        if: needs.detect.outputs.is_release == 'true'
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -Pandroid.buildAbiSplits=true -Pandroid.versionCode=${{ needs.detect.outputs.version_code }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: ordo-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk

  release:
    needs: [detect, build_apk]
    if: needs.detect.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download APK artifact
        uses: actions/download-artifact@v6
        with:
          name: ordo-apk
          path: apk

      - name: Rename APKs
        run: |
          VERSION="${{ needs.detect.outputs.version }}"
          cd apk
          # universal (all ABIs) -> ordo-vX.Y.Z.apk
          if [ -f app-universal-release.apk ]; then
            mv app-universal-release.apk "ordo-v${VERSION}.apk"
          elif [ -f app-release.apk ]; then
            mv app-release.apk "ordo-v${VERSION}.apk"
          fi
          # per-ABI splits -> ordo-vX.Y.Z-<abi>.apk
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            if [ -f "app-${abi}-release.apk" ]; then
              mv "app-${abi}-release.apk" "ordo-v${VERSION}-${abi}.apk"
            fi
          done
          echo "## APKs to publish:" >> "$GITHUB_STEP_SUMMARY"
          ls -1 ordo-v*.apk | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          gh release upload "$TAG" apk/ordo-v*.apk --clobber -R "$GITHUB_REPOSITORY"
