name: Release branch

# A published version must already live on its release/x.y.z branch.
# This workflow only checks that. It does not create the branch, move it,
# or merge anything into main. main never publishes a version release.
# ci.yml runs the same check (via .github/scripts/require-release-branch.sh)
# before it will attach APKs or the server archive; this guard stands alone
# so the policy still holds if ci.yml is mid-refactor.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-branch-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require the matching release branch
        env:
          GITHUB_SHA: ${{ github.sha }}
          TAG: ${{ github.event.release.tag_name }}
          TARGET: ${{ github.event.release.target_commitish }}
        run: bash .github/scripts/require-release-branch.sh "$TAG" "$TARGET"
