name: Release maintenance

# Keeps release/x.y maintenance branches and main in sync around GitHub
# Releases, so the hotfix flow needs zero manual branch surgery:
#
#   release published for vX.Y.Z (stable or early)
#     1. release/x.y missing  -> create it at the tag commit and push it
#     2. tag is ahead of it   -> fast-forward it to the tag (normal hotfix)
#     3. merge release/x.y back into main (no-ff) so the next version
#        inherits every hotfix. Conflicts -> opens a PR instead of failing.
#
# Branch slices ignore the patch/prerelease part: v0.1.0 and v0.1.4-beta.2
# both map to release/0.1. Tags that are not on the branch's line (re-tagged
# old versions) are reported and left alone.
#
# Requires the tag to match the semver shape ci.yml enforces.

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-maintenance-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve maintenance branch
        id: branch
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="${TAG#v}"
          if [[ ! "$TAG" =~ ^([0-9]+)\.([0-9]+)\. ]]; then
            echo "::error::Tag '${{ github.event.release.tag_name }}' is not vX.Y.Z(.pre); cannot derive a release/x.y branch."
            exit 1
          fi
          BR="release/${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          echo "branch=$BR" >> "$GITHUB_OUTPUT"
          echo "Maintenance branch: $BR (tag ${{ github.event.release.tag_name }} @ ${{ github.sha }})"

      - name: Sync release branch to tag
        id: sync
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_SHA="${{ github.sha }}"
          git fetch origin "$BRANCH" || true
          if ! git rev-parse --verify --quiet "origin/$BRANCH" > /dev/null; then
            git push origin "refs/tags/${{ github.event.release.tag_name }}:refs/heads/$BRANCH"
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "Created $BRANCH at ${TAG_SHA:0:12}"
          elif [[ "$(git rev-parse "origin/$BRANCH")" == "$TAG_SHA" ]]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "$BRANCH already at tag"
          elif git merge-base --is-ancestor "origin/$BRANCH" "$TAG_SHA"; then
            git push origin "$TAG_SHA:refs/heads/$BRANCH"
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "Fast-forwarded $BRANCH to ${TAG_SHA:0:12}"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Tag is not ahead of $BRANCH; leaving the branch untouched."
          fi

      - name: Merge back to main
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          if git merge-base --is-ancestor "origin/$BRANCH" main; then
            echo "main already contains $BRANCH; nothing to merge."
            exit 0
          fi
          if git merge --no-ff --no-edit "origin/$BRANCH"; then
            git push origin main
            echo "Merged $BRANCH into main ($(git rev-parse --short HEAD))"
          else
            echo "::error::Automatic merge of $BRANCH into main conflicted."
            gh pr create --base main --head "$BRANCH" \
              --title "Merge $BRANCH into main (conflicts need manual resolution)" \
              --body "Automated merge-back after the ${{ github.event.release.tag_name }} release hit conflicts. Resolve manually here; main will not pick up the hotfixes until this merges."
            exit 1
          fi
