packages:
  - "packages/*"
  - "apps/*"

minimumReleaseAgeExclude:
  - '@nestjs/cli@12.0.1'
  - '@nestjs/common@12.0.2'
  - '@nestjs/core@12.0.2'
  - '@nestjs/platform-express@12.0.2'
  - '@nestjs/schematics@12.0.2'

nodeLinker: hoisted

auditConfig:
  ignoreGhsas:
    # node-forge RSA PKCS#1 v1.5 signature forgery via nested DigestAlgorithm
    # padding (GHSA-86w9-cpqp-85rv / CVE-2026-85393; vulnerable <=1.4.0, no
    # patched release exists — fix PR digitalbazaar/forge#1152 is still open).
    # node-forge here only backs @expo/cli and @expo/code-signing-certificates:
    # developer/CI tooling that never ships in the APK, and its verify calls
    # only check certificates and signatures the tooling itself just made.
    # ordo updates ship unsigned, so no forged signature reaches a device.
    # expires: 2026-11-01 — the audit-ignore watchdog fails CI on this date
    # or the day a patched node-forge is published, whichever comes first.
    - GHSA-86w9-cpqp-85rv
    # braces recursive AST stack-exhaustion DoS (GHSA-vfj7-8cjw-p6xm).
    # npm still publishes only <=3.0.3; the audit's suggested 3.0.4 does not
    # exist, and GitHub lists no patched release. Our production dependency
    # paths are Metro/micromatch build tooling, not APK or backend execution.
    # Glob patterns come from developer-controlled build configuration;
    # saved URLs and article content are never passed to this parser.
    # expires: 2026-11-01 — remove when an upstream patch is published.
    - GHSA-vfj7-8cjw-p6xm

overrides:
  js-yaml: 4.3.2
  "@xmldom/xmldom": 0.9.12
  fast-uri: 3.1.9
  mysql2: 3.23.1
  nanoid@3: 3.3.18
  brace-expansion@5: 5.0.12
  deepmerge-ts: 8.0.1
  # Fix malformed URI decoding and quadratic work in query-string's decoder.
  # The patch below keeps query-string 7's CommonJS and plus-sign behavior.
  decode-uri-component: 0.5.1
  # CVE audit floors for transitive deps whose parents have not caught up:
  # compression DoS (>=1.8.2), source-map-js event-loop DoS (>=1.2.2),
  # proxy-addr IPv4-mapped IP spoofing (>=2.0.8), shell-quote quote()
  # command injection (>=1.11.0).
  # zod memory exhaustion via oversized unconstrained arrays (>=4.6.6;
  # also lifts @expo/cli's frozen zod-3.25 pin — its schema usage is
  # zod-4-compatible), body-parser compressed-body DoS (>=2.4.0),
  # multer async fileFilter DoS (>=2.5.0).
  zod: 4.6.6
  body-parser: 2.4.0
  multer: 2.5.0
  # qs bracket-key array-limit bypass and isBuffer DoS (>=6.16.0; express
  # pins an exact qs), uuid v3/v5/v6 buffer bounds (>=11.1.1; the xcode
  # parser under @expo/config-plugins only calls uuid.v4()).
  qs: 6.16.1
  uuid@7: 11.1.1
  compression: 1.8.2
  source-map-js: 1.2.2
  proxy-addr: 2.0.8
  shell-quote: 1.11.0

# Only these packages may run install/postinstall scripts. Do not pass
# --config.dangerouslyAllowAllBuilds=true; add a package here instead.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@swc/core": true
  better-sqlite3: true
  prisma: true

patchedDependencies:
  '@expo/plist@0.8.1': patches/@expo__plist@0.8.1.patch
  decode-uri-component@0.5.1: patches/decode-uri-component@0.5.1.patch
  react-native-reanimated@4.5.1: patches/react-native-reanimated@4.5.1.patch
  react-native-webview@13.16.1: patches/react-native-webview@13.16.1.patch
