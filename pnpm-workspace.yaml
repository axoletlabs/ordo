  - '@nestjs/common@12.0.2'
  - '@nestjs/core@12.0.2'
  - '@nestjs/platform-express@12.0.2'
  - '@nestjs/schematics@12.0.2'
  - '@nestjs/testing@12.0.2'
  - zod@4.6.5

nodeLinker: hoisted

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "@swc/core"
  - better-sqlite3
  - prisma
