packages:
  - "packages/*"
  - "apps/*"

minimumReleaseAgeExclude:
  - '@nestjs/cli@12.0.1'
  - '@nestjs/common@12.0.2'
  - '@nestjs/core@12.0.2'
  - '@nestjs/platform-express@12.0.2'
  - '@nestjs/schematics@12.0.2'
  - '@nestjs/testing@12.0.2'
  - zod@4.6.5

nodeLinker: hoisted

auditConfig:
  ignoreGhsas:
    # node-forge RSA PKCS#1 v1.5 verification (vulnerable <=1.4.0, no patched
    # release exists yet). Only @expo/cli and @expo/code-signing-certificates
    # use it — CI build tooling that never ships in an APK or runs on devices,
    # and we do not use EAS code signing. Remove when a fixed node-forge ships.
    - GHSA-86w9-cpqp-85rv

overrides:
  js-yaml: 4.3.2
  "@xmldom/xmldom": 0.9.12
  fast-uri: 3.1.8
  mysql2: 3.22.0
  nanoid@3: 3.3.18
  brace-expansion@5: 5.0.12
  deepmerge-ts: 8.0.1

# Only these packages may run install/postinstall scripts. Do not pass
# --config.dangerouslyAllowAllBuilds=true; add a package here instead.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@swc/core": true
  better-sqlite3: true
  prisma: true
