packages:
  - "packages/*"
  - "apps/*"

minimumReleaseAgeExclude:
  - '@nestjs/cli@12.0.1'
  - '@nestjs/common@12.0.2'
  - '@nestjs/core@12.0.2'
  - '@nestjs/platform-express@12.0.2'
  - '@nestjs/schematics@12.0.2'
  - '@nestjs/testing@12.0.2'
  - zod@4.6.5

nodeLinker: hoisted

overrides:
  js-yaml: 4.3.2
  "@xmldom/xmldom": 0.9.12
  fast-uri: 3.1.8
  mysql2: 3.22.0
  nanoid@3: 3.3.18
  brace-expansion@5: 5.0.12
  deepmerge-ts: 8.0.1

# GHSA-86w9-cpqp-85rv (node-forge PKCS#1 v1.5 verification) ships only through
# @expo/cli's code-signing tooling at build time; no patched release exists on
# npm yet (needs >=1.4.1, latest is 1.4.0). Drop this once 1.4.1 is published
# and reachable via overrides.
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv

# Only these packages may run install/postinstall scripts. Do not pass
# --config.dangerouslyAllowAllBuilds=true; add a package here instead.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@swc/core": true
  better-sqlite3: true
  prisma: true
